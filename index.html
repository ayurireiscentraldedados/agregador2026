<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregador Eleitoral - Central de Dados</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Roboto Condensed', sans-serif;
            background-color: #2f2f45;
        }

        .apexcharts-legend-text {
            color: #475569 !important;
            font-size: 14px !important;
            font-weight: bold !important;
            transition: opacity 0.2s ease;
            cursor: pointer;
        }

        select {
            text-align-last: center;
        }

        select option {
            background-color: #2f2f45;
            color: #ffffff;
            text-align: center;
            font-weight: bold;
        }

        /* Libera as bordas para a ferramenta não ser cortada */
        #container-chart-presidencia,
        #container-chart-avaliacao {
            overflow: visible !important;
        }

        /* Esconde a toolbar nativa do ApexCharts permanentemente */
        .apexcharts-toolbar {
            display: none !important;
        }

        /* Contexto de empilhamento do wrapper interno do ApexCharts */
        .apexcharts-canvas {
            position: relative !important;
            z-index: 1 !important;
        }

        /* Remove o atraso de transição padrão (lag) do tooltip do ApexCharts */
        .apexcharts-tooltip {
            transition: left 0.05s ease, top 0.05s ease !important;
        }

        /* Legenda customizada (HTML), controlada por AvaliacaoApp/PresidenciaApp */
        .legenda-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 999px;
            border: 2px solid transparent;
            background-color: #f1f5f9;
            color: #334155;
            font-family: 'Roboto Condensed', sans-serif;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.15s ease;
            user-select: none;
        }

        .legenda-pill:hover {
            background-color: #e2e8f0;
            transform: translateY(-1px);
        }

        .legenda-pill:active {
            transform: scale(0.95);
        }

        /* Estado "desligado": candidato oculto no gráfico */
        .legenda-pill.inativo {
            opacity: 0.35;
            background-color: transparent;
            transform: scale(0.98);
            filter: grayscale(100%);
        }

        .legenda-pill .legenda-marker {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
        }

        #container-chart-presidencia:fullscreen,
        #container-chart-avaliacao:fullscreen {
            background-color: #ffffff;
            padding-top: 70px !important;
            padding-left: 20px;
            padding-right: 20px;
            padding-bottom: 20px;
            overflow-y: auto;
        }

        #container-chart-presidencia:fullscreen .apexcharts-tooltip,
        #container-chart-avaliacao:fullscreen .apexcharts-tooltip {
            transform: scale(1.6) translateY(-20px);
            transform-origin: bottom center;
            pointer-events: none;
        }

        /* Legenda customizada também aumenta em tela cheia */
        #container-chart-presidencia:fullscreen .legenda-pill,
        #container-chart-avaliacao:fullscreen .legenda-pill {
            font-size: 16px;
            padding: 6px 14px;
        }

        #container-chart-presidencia:fullscreen .legenda-marker,
        #container-chart-avaliacao:fullscreen .legenda-marker {
            width: 14px;
            height: 14px;
        }

        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.95) translateY(-5px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .animate-dropdown {
            animation: fadeInScale 0.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        .animate-fade {
            animation: fadeIn 0.3s ease forwards;
        }
    </style>
</head>

    <!-- Versão 16: legenda própria em HTML, multi-seleção estável -->
    <script src="dataService.js?v=16"></script>
    <script src="presidenciaApp.js?v=16"></script>
    <script src="avaliacaoApp.js?v=16"></script>

    <script>
        let lastScrollY = 0;

        function toggleDropdown(menuId) {
            const menu = document.getElementById(menuId);
            if (menu.classList.contains('hidden')) {
                menu.classList.remove('hidden');
                menu.classList.add('animate-dropdown');
            } else {
                menu.classList.add('hidden');
                menu.classList.remove('animate-dropdown');
            }
        }

        function triggerApexTool(chartType, toolName) {
            const container = document.getElementById(`container-chart-${chartType}`);
            const icon = container.querySelector(`.apexcharts-${toolName}-icon`);
            if (icon) icon.click();
            document.getElementById(`menu-tools-${chartType}`).classList.add('hidden');
            document.getElementById(`menu-tools-${chartType}`).classList.remove('animate-dropdown');
        }

        function toggleFullscreen(containerId) {
            const elem = document.getElementById(containerId);
            if (!document.fullscreenElement) {
                lastScrollY = window.scrollY;
                elem.requestFullscreen().catch(err => console.log(err));
            } else {
                document.exitFullscreen();
            }
        }

        document.addEventListener('fullscreenchange', () => {
            const fsElement = document.fullscreenElement;
            const isFull = !!fsElement;
            const formatarY = function (value) { return Number(value).toFixed(1).replace('.', ',') + '%'; };

            if (typeof PresidenciaApp !== 'undefined' && PresidenciaApp.chartInstance) {
                const isThisFull = isFull && fsElement.id === 'container-chart-presidencia';
                PresidenciaApp.chartInstance.updateOptions({
                    chart: { height: isThisFull ? (window.innerHeight - 160) : 550 },
                    xaxis: { labels: { style: { fontSize: isThisFull ? '18px' : '13px' } } },
                    yaxis: { labels: { style: { fontSize: isThisFull ? '20px' : '14px' }, formatter: formatarY } }
                });
            }

            if (typeof AvaliacaoApp !== 'undefined' && AvaliacaoApp.chartInstance) {
                const isThisFull = isFull && fsElement.id === 'container-chart-avaliacao';
                AvaliacaoApp.chartInstance.updateOptions({
                    chart: { height: isThisFull ? (window.innerHeight - 160) : 480 },
                    xaxis: { labels: { style: { fontSize: isThisFull ? '18px' : '13px' } } },
                    yaxis: { labels: { style: { fontSize: isThisFull ? '20px' : '14px' }, formatter: formatarY } }
                });
            }

            if (!isFull) {
                setTimeout(() => { window.scrollTo(0, lastScrollY); }, 100);
            }
        });

        document.addEventListener('DOMContentLoaded', async () => {
            const linkPresidenciaAvaliacao = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRS_mh05CDPD9fdkANE96iS4mh9MTkSH0EUM-0xvfmNcvkbqI1BU-4lrCPRwJdsDFDPV3ZntHE6ZZUR/pub?gid=0&single=true&output=csv';
            const linkGovernadorSenador = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRsleAjtRKnintxw6friHfZTBL2169jmBQAArFSQKLvJhpPTR2NWhnESi-UDKmubbmZCrOoFF13GOyn/pub?gid=0&single=true&output=csv';

            try {
                await DataService.carregarDados(linkPresidenciaAvaliacao, linkGovernadorSenador);
                PresidenciaApp.init();
                AvaliacaoApp.init();

                const tabs = ['presidencia', 'governo', 'senado'];
                tabs.forEach(tab => {
                    document.getElementById(`btn-tab-${tab}`).addEventListener('click', () => {
                        tabs.forEach(t => {
                            document.getElementById(`app-${t}`).classList.add('hidden');
                            document.getElementById(`app-${t}`).classList.remove('flex', 'animate-fade');
                            const btn = document.getElementById(`btn-tab-${t}`);
                            btn.className = "text-white hover:bg-white/10 rounded-full px-8 py-2 font-bold transition-all duration-300";
                        });
                        const target = document.getElementById(`app-${tab}`);
                        target.classList.remove('hidden');
                        target.classList.add('flex', 'animate-fade');
                        document.getElementById(`btn-tab-${tab}`).className = "bg-white text-[#2f2f45] rounded-full px-8 py-2 font-bold shadow transition-all duration-300 transform scale-105";
                    });
                });
            } catch (error) {
                console.error("Erro ao iniciar a aplicação da Central de Dados:", error);
            }
        });
    </script>
</body>

</html>
